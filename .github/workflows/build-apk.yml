name: Build KhabarKhon Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Generate Native Android TV Project (KhabarKhon)
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/khabarkhon/tv
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KhabarKhonTV"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.khabarkhon.tv'
              compileSdk 34

              defaultConfig {
                  applicationId "ir.khabarkhon.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # App Name: خبرخوان
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">خبرخوان</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/tv_banner.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <gradient
                          android:angle="0"
                          android:startColor="#065F46"
                          android:centerColor="#0F172A"
                          android:endColor="#991B1B"
                          android:type="linear" />
                      <corners android:radius="14dp" />
                      <stroke android:width="3dp" android:color="#F59E0B" />
                  </shape>
              </item>
          </layer-list>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="oval">
                      <solid android:color="#0F172A" />
                      <stroke android:width="4dp" android:color="#F59E0B" />
                  </shape>
              </item>
          </layer-list>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="ir.khabarkhon.tv">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@drawable/tv_banner"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # Non-blocking Async MainActivity.java (Zero UI Freeze)
          cat << 'EOF' > app/src/main/java/ir/khabarkhon/tv/MainActivity.java
          package ir.khabarkhon.tv;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private WebView webView;
              private final ExecutorService networkExecutor = Executors.newFixedThreadPool(3);

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF050811);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.addJavascriptInterface(new AsyncBridge(), "AndroidBridge");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AsyncBridge {
                  @JavascriptInterface
                  public void fetchTelegramAsync(final String channelHandle, final String urlString) {
                      networkExecutor.execute(() -> {
                          HttpURLConnection conn = null;
                          try {
                              URL url = new URL(urlString);
                              conn = (HttpURLConnection) url.openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setConnectTimeout(5000);
                              conn.setReadTimeout(5000);
                              conn.setRequestMethod("GET");
                              conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)");

                              InputStream is = conn.getInputStream();
                              BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  sb.append(line).append("\n");
                              }
                              reader.close();

                              final String safeJson = JSONObject.quote(sb.toString());
                              final String safeHandle = JSONObject.quote(channelHandle);

                              runOnUiThread(() -> {
                                  if (webView != null) {
                                      webView.evaluateJavascript("window.onNativeTelegramData(" + safeHandle + ", " + safeJson + ");", null);
                                  }
                              });
                          } catch (Exception ignored) {
                          } finally {
                              if (conn != null) conn.disconnect();
                          }
                      });
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      webView.evaluateJavascript(
                          "(function() {" +
                          "  var m = document.getElementById('app-modal');" +
                          "  if (m && m.classList.contains('open')) { closeModal(); return 'CLOSED'; }" +
                          "  return 'EXIT';" +
                          "})();",
                          val -> {
                              if (val == null || !val.contains("CLOSED")) {
                                  finish();
                              }
                          }
                      );
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  networkExecutor.shutdownNow();
              }
          }
          EOF

      - name: 5. Build Signed APK with Gradle
        run: gradle assembleRelease --no-daemon

      - name: 6. Rename APK to KhabarKhon
        run: |
          cp app/build/outputs/apk/release/app-release.apk KhabarKhon-TV.apk

      - name: 7. Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhabarKhon-TV-APK
          path: KhabarKhon-TV.apk
