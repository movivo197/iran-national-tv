name: Build KhabarKhon Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Generate Signed Android Mobile Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/khabarkhon/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          # Generate a valid PNG icon (prevents Package Installer crash on Samsung/Xiaomi)
          base64 -d << 'EOF' > app/src/main/res/mipmap-hdpi/ic_launcher.png
          iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABOSURBVHhe7c4xAQAwDASh+jf91cKkC8G7s5N9A94AaYBUQLogVZAuSBWkC1IF6YJUQbogVZAuSBWkC1IF6YJUQbogVZAuSBWkC9pgH1gB868N71EAAAAASUVORK5CYII=
          EOF

          # Generate Official Release Keystore (V1 + V2 Signing)
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias khabarkhon \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=KhabarKhon, OU=Mobile, O=Iran, L=Tehran, S=IR, C=IR"

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KhabarKhonApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.khabarkhon.app'
              compileSdk 34

              defaultConfig {
                  applicationId "ir.khabarkhon.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 10
                  versionName "4.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../release-key.jks")
                      storePassword "123456"
                      keyAlias "khabarkhon"
                      keyPassword "123456"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">خبرخوان</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/ir/khabarkhon/app/MainActivity.java
          package ir.khabarkhon.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private WebView webView;
              private final ExecutorService networkExecutor = Executors.newFixedThreadPool(3);

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      Window window = getWindow();
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      window.setStatusBarColor(Color.parseColor("#060913"));
                      window.setNavigationBarColor(Color.parseColor("#0A0F1D"));
                  }

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#060913"));

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");

                  webView.addJavascriptInterface(new AsyncBridge(), "AndroidBridge");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tg:") || url.contains("t.me/") || url.contains("youtube.com/@") || url.contains("youtube.com/results")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {}
                          }
                          return false;
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AsyncBridge {
                  @JavascriptInterface
                  public void fetchTelegramAsync(final String channelHandle, final String urlString) {
                      networkExecutor.execute(() -> {
                          HttpURLConnection conn = null;
                          try {
                              URL url = new URL(urlString);
                              conn = (HttpURLConnection) url.openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setConnectTimeout(6000);
                              conn.setReadTimeout(6000);
                              conn.setRequestMethod("GET");
                              conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64)");

                              InputStream is = conn.getInputStream();
                              BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  sb.append(line).append("\n");
                              }
                              reader.close();

                              final String safeJson = JSONObject.quote(sb.toString());
                              final String safeHandle = JSONObject.quote(channelHandle);

                              runOnUiThread(() -> {
                                  if (webView != null) {
                                      webView.evaluateJavascript("window.onNativeTelegramData(" + safeHandle + ", " + safeJson + ");", null);
                                  }
                              });
                          } catch (Exception ignored) {
                          } finally {
                              if (conn != null) conn.disconnect();
                          }
                      });
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      webView.evaluateJavascript(
                          "(function() {" +
                          "  var s = document.getElementById('bottom-sheet');" +
                          "  if (s && s.classList.contains('open')) { closeSheet(); return 'CLOSED'; }" +
                          "  return 'EXIT';" +
                          "})();",
                          val -> {
                              if (val == null || !val.contains("CLOSED")) {
                                  finish();
                              }
                          }
                      );
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  networkExecutor.shutdownNow();
              }
          }
          EOF

      - name: 5. Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: 6. Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk KhabarKhon-Mobile-Signed.apk

      - name: 7. Upload Signed Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: KhabarKhon-Mobile-Signed
          path: KhabarKhon-Mobile-Signed.apk
