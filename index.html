                        if (lines.length > 0) {
                            const latestLine = lines[lines.length - 1].slice(0, 220);
                            const existingIdx = telegramPosts.findIndex(p => p.channelHandle === '@' + ch.handle);
                            if (existingIdx !== -1) {
                                telegramPosts[existingIdx].timeAgo = 'بروزرسانی زنده (هم‌اکنون)';
                            } else {
                                telegramPosts.unshift({
                                    id: Date.now() + Math.random(),
                                    channelName: ch.name,
                                    channelHandle: '@' + ch.handle,
                                    timeAgo: 'هم‌اکنون (زنده)',
                                    views: 'جدید',
                                    tag: ch.tag,
                                    title: latestLine.slice(0, 95) + '...',
                                    summary: latestLine,
                                    color: 'sky'
                                });
                            }
                        }
                    }
                }
            } catch (_) {
                // Fallback gracefully to preloaded realistic feeds
            } finally {
                setTimeout(() => {
                    icon.classList.remove('fa-spin');
                    if (statusEl) {
                        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 live-dot"></span> بروزرسانی شد`;
                    }
                    renderAll();
                }, 600);
            }
        }

        // =========================================================================
        // 5. ANDROID TV D-PAD / KEYBOARD NAVIGATION & TRIPLE CALENDAR CLOCK
        // =========================================================================
        function simulateDpad(key) {
            window.dispatchEvent(new KeyboardEvent('keydown', { key: key }));
        }
<!-- ... existing code ... -->
        function toPersianDigits(str) {
            return String(str).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('live-clock').textContent = timeStr;
            const simClock = document.getElementById('sim-overlay-clock');
            if (simClock) simClock.textContent = now.toLocaleTimeString('en-US', { hour12: false }) + ' LIVE';

            try {
                // 1. Solar Hijri (خورشیدی) + Imperial (شاهنشاهی = Solar Hijri + 1180)
                const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                }).formatToParts(now);

                let day = '', month = '', yearStr = '', weekday = '';
                parts.forEach(p => {
                    if (p.type === 'day') day = p.value;
                    if (p.type === 'month') month = p.value;
                    if (p.type === 'year') yearStr = p.value;
                    if (p.type === 'weekday') weekday = p.value;
                });

                // Convert Persian digits in yearStr to English number to add 1180 for Shahanshahi Calendar
                const englishYear = parseInt(yearStr.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)), 10);
                const imperialYear = !isNaN(englishYear) ? toPersianDigits(englishYear + 1180) : '۲۵۸۵';

                document.getElementById('persian-date').textContent = `${weekday} ${day} ${month} ${yearStr}`;
                document.getElementById('imperial-date').textContent = `${day} ${month} ${imperialYear} شاهنشاهی`;

                // 2. Gregorian Calendar (میلادی)
                const gregStr = new Intl.DateTimeFormat('en-US', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                }).format(now);
                document.getElementById('gregorian-date').textContent = gregStr;
            } catch (_) {}
        }

        window.onload = function () {
            renderAll();
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>
